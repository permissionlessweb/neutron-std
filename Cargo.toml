[workspace]
members = ["packages/*", "proto-build"]
resolver = "2"

[workspace.dependencies]
base64 = "0.21.7"
bech32 = "0.9.1"
cosmwasm-schema = { version = "=4.0.0-zk" }
cosmwasm-std = { version = "=4.0.0-zk" }
cw-storage-plus = { version = "3.0.1" }
cw2 = { version = "3.0.0" }
hex = "0.4.3"
prost = "0.14.1"
prost-types = "0.14.1"
protobuf = "~3.3.0"
schemars = "0.8"
serde = { version = "1.0.188", default-features = false }
serde-json-wasm = "1.0.0"
serde_json = { version = "1.0.87" }
speedate = "0.13.0"
thiserror = "1.0.49"

cosmos-sdk-proto = { version = "0.28.0" }
tendermint-proto = { version = "0.40.4" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[patch.crates-io]

cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
tendermint-proto = { path = "../tendermint-rs/proto" }

